name: Jira Telegram Notifier

on:
  schedule:
    # Cron schedule (always in UTC!)
    # Default: every hour from 09:00 to 18:00 UTC on weekdays (Mon–Fri)
    # 24/7 every hour: "0 * * * *"
    # Every day 09:00–18:00 UTC: "0 9-18 * * *"
    - cron: "0 9-18 * * 1-5"
  workflow_dispatch: # Allows manual trigger from the GitHub Actions UI

permissions:
  # Write permission is required so the workflow can commit updated state.json
  contents: write

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests

      - name: Check Jira updates and comments
        env:
          # Set your Jira base URL (no trailing slash) and project key
          JIRA_URL: https://your-jira.example.com
          JIRA_PROJECT: YOUR_PROJECT

          # Secrets from Settings → Secrets and variables → Actions
          JIRA_TOKEN: ${{ secrets.JIRA_TOKEN }}
          JIRA_USER: ${{ secrets.JIRA_USER }}
          JIRA_PASSWORD: ${{ secrets.JIRA_PASSWORD }}
          JIRA_IGNORE_USER: ${{ secrets.JIRA_IGNORE_USER }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: python notifier.py

      - name: Save state.json to repository
        run: |
          if [[ -n $(git status --porcelain state.json) ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add state.json
            git commit -m "Update state [skip ci]"
            git push
          fi
